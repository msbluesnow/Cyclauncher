name: F-Droid status check

on:
  schedule:
    - cron: "0 * * * *"  # every hour
  workflow_dispatch: {}   # allows manual run from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Restore saved status
        uses: actions/cache/restore@v4
        with:
          path: scripts/fdroid_state.json
          key: fdroid-state-${{ github.run_id }}
          restore-keys: |
            fdroid-state-

      - name: Check F-Droid status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/fdroid_status.py --notify

      - name: Save status
        uses: actions/cache/save@v4
        if: always()
        with:
          path: scripts/fdroid_state.json
          key: fdroid-state-${{ github.run_id }}
